name: Daily Auto Video Render

on:
  workflow_dispatch:
    inputs:
      seconds_per_image:
        description: 'ပုံတစ်ပုံချင်းစီပြမည့် ကြာချိန် (စက္ကန့်)'
        required: true
        default: '8'
        type: string
      transition_duration:
        description: 'Transition / Fade ကြာချိန် (စက္ကန့် - ဥပမာ 1)'
        required: true
        default: '1'
        type: string
      video_preset:
        description: 'Render အမြန်နှုန်း (ultrafast, fast, medium)'
        required: true
        default: 'ultrafast'
        type: choice
        options:
          - ultrafast
          - fast
          - medium
      video_quality:
        description: 'ဗီဒီယို Quality (CRF - နံပါတ်ငယ်လေ အရည်အသွေးကောင်းလေ၊ ဥပမာ 23)'
        required: true
        default: '23'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository ကို ယူဆောင်ခြင်း (Checkout)
      uses: actions/checkout@v3

    - name: Python ထည့်သွင်းခြင်း
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: လိုအပ်သော Packages များ ထည့်သွင်းခြင်း
      run: |
        python -m pip install --upgrade pip
        pip install gdown

    - name: FFmpeg ထည့်သွင်းခြင်း
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Python Script အလုပ်လုပ်ရန် စတင်ခြင်း
      env:
        AUDIO_FOLDER_ID: ${{ secrets.AUDIO_FOLDER_ID }}
        IMAGES_FOLDER_ID: ${{ secrets.IMAGES_FOLDER_ID }}
        INPUT_SECONDS: ${{ github.event.inputs.seconds_per_image }}
        INPUT_TRANSITION: ${{ github.event.inputs.transition_duration }}
        INPUT_PRESET: ${{ github.event.inputs.video_preset }}
        INPUT_CRF: ${{ github.event.inputs.video_quality }}
      run: |
        python render.py

    - name: ဗီဒီယိုဖိုင်ကို Artifact အဖြစ် သိမ်းဆည်းခြင်း (Download ဆွဲရန်)
      uses: actions/upload-artifact@v4
      with:
        name: generated-video
        path: final_output.mp4
