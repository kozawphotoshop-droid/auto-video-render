name: Daily Auto Video Render

on:
  schedule:
    - cron: '0 15 * * *' # နေ့စဉ် မြန်မာစံတော်ချိန် ည ၉:၃၀ နာရီတွင် အလိုအလျောက် Run မည် (UTC အချိန်ဖြင့် ညနေ ၃:၀၀ နာရီ)
  workflow_dispatch: # လက်ဖြင့် ကိုယ်တိုင် ခလုတ်နှိပ် Run လိုပါက သုံးရန်

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository ကို ယူဆောင်ခြင်း (Checkout)
      uses: actions/checkout@v3

    - name: Python ထည့်သွင်းခြင်း
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: FFmpeg ထည့်သွင်းခြင်း
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Python Script အလုပ်လုပ်ရန် စတင်ခြင်း
      env:
        AUDIO_FOLDER_ID: ${{ secrets.AUDIO_FOLDER_ID }}
        IMAGES_FOLDER_ID: ${{ secrets.IMAGES_FOLDER_ID }}
      run: |
        python render.py

    - name: ဗီဒီယိုဖိုင်ကို Artifact အဖြစ် သိမ်းဆည်းခြင်း (Download ဆွဲရန်)
      uses: actions/upload-artifact@v3
      with:
        name: generated-video
        path: final_output.mp4

    - name: State ဖိုင်အသစ်ကို GitHub သို့ ပြန်လည်သိမ်းဆည်းခြင်း (Commit & Push)
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Auto-update state.json and render daily video"
        branch: main
